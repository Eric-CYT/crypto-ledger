<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://api.binance.com https://api1.binance.com https://api2.binance.com https://api3.binance.com https://data-api.binance.vision https://open.er-api.com https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>加密貨幣帳本</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232a78d6'/%3E%3Cpath d='M6 16l4-5 3 3 5-7' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --bg: #f9f9f7; --surface: #fcfcfb;
  --ink: #0b0b0b; --ink-2: #52514e; --ink-3: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --border: rgba(11, 11, 11, 0.10);
  --hover: rgba(11, 11, 11, 0.05);
  --accent: #256abf; --accent-ink: #ffffff;
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100;
  --c5: #e87ba4; --c6: #008300; --c7: #4a3aa7; --c8: #e34948;
  --c-other: #a9a8a1;
  --txt-red: #d03b3b; --txt-green: #006300;
  --danger: #d03b3b; --st-good: #0ca30c; --st-warn: #fab219; --st-bad: #d03b3b;
  --cost-fill: #ffffff; --cost-stroke: #8f8e88;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.07);
    --accent: #3987e5; --accent-ink: #0b0b0b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --c-other: #5a5a56;
    --txt-red: #e66767; --txt-green: #0ca30c; --danger: #e66767;
    --cost-fill: #ffffff; --cost-stroke: transparent;
  }
}
:root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0d0d0d; --surface: #1a1a19;
    --ink: #ffffff; --ink-2: #c3c2b7; --ink-3: #898781;
    --grid: #2c2c2a; --axis: #383835; --border: rgba(255, 255, 255, 0.10);
    --hover: rgba(255, 255, 255, 0.07);
    --accent: #3987e5; --accent-ink: #0b0b0b;
    --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500;
    --c5: #d55181; --c6: #008300; --c7: #9085e9; --c8: #e66767;
    --c-other: #5a5a56;
    --txt-red: #e66767; --txt-green: #0ca30c; --danger: #e66767;
    --cost-fill: #ffffff; --cost-stroke: transparent;
}

:root[data-ud="red-up"] { --gain: var(--txt-red); --loss: var(--txt-green); }
:root[data-ud="green-up"] { --gain: var(--txt-green); --loss: var(--txt-red); }
:root:not([data-ud]) { --gain: var(--txt-red); --loss: var(--txt-green); }

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
}
h1, h2, h3, p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
.muted { color: var(--ink-2); }
.num { font-variant-numeric: tabular-nums; }
.gain { color: var(--gain); }
.loss { color: var(--loss); }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- 版面 ---------- */
.page { max-width: 1080px; margin: 0 auto; padding: 0 16px 64px; }
.topbar { display: flex; align-items: center; gap: 12px; padding: 16px 0 12px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 18px; font-weight: 650; margin-right: auto; }
.brand svg { flex: none; }
.status { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); }
.status.ok .dot { background: var(--st-good); }
.status.loading .dot { background: var(--st-warn); }
.status.error .dot { background: var(--st-bad); }
.tools { display: flex; gap: 6px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 36px; padding: 6px 14px; border-radius: 8px; cursor: pointer; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); font-weight: 550;
}
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.btn.primary:hover { filter: brightness(1.08); background: var(--accent); }
.btn.danger { color: var(--danger); }
.btn.danger.solid { background: var(--danger); color: #fff; border-color: transparent; }
.btn.icon { width: 36px; padding: 0; }
.btn.small { min-height: 28px; padding: 2px 10px; font-size: 13px; }
.btn.link { border: 0; background: none; color: var(--accent); padding: 2px 4px; min-height: 0; text-decoration: underline; font-weight: 500; }
.btn[disabled] { opacity: 0.5; cursor: default; }
.is-loading { opacity: 0.6; transition: opacity 0.15s; }

.filters { display: flex; flex-wrap: wrap; gap: 12px 24px; padding: 8px 0 16px; align-items: flex-end; }
.fgroup { display: flex; flex-direction: column; gap: 4px; }
.flabel { font-size: 12px; color: var(--ink-2); }
.segctl { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 2px; gap: 2px; }
.segctl button { border: 0; background: none; padding: 5px 12px; border-radius: 6px; cursor: pointer; min-height: 30px; white-space: nowrap; color: var(--ink-2); }
.segctl button:hover { background: var(--hover); }
.segctl button[aria-checked="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; }
.card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-head h2 { font-size: 16px; font-weight: 650; margin-right: auto; }
.card-sub { font-size: 12.5px; color: var(--ink-2); }
.foot { font-size: 12px; color: var(--ink-2); margin-top: 8px; }

.notice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--border); border-left: 4px solid var(--st-warn);
  border-radius: 8px; background: var(--surface); padding: 10px 12px; margin-bottom: 10px; font-size: 13.5px; }
.notice svg { flex: none; margin-top: 2px; color: var(--ink-2); }
.notice .grow { flex: 1; }

/* ---------- 摘要 ---------- */
.hero-label { font-size: 13px; color: var(--ink-2); }
.hero-value { font-size: clamp(2.5rem, 7vw, 3.5rem); font-weight: 650; line-height: 1.1; margin: 4px 0; letter-spacing: -0.01em; overflow-wrap: anywhere; }
.hero-value .unit { font-size: 0.35em; font-weight: 500; color: var(--ink-2); margin-left: 8px; letter-spacing: 0; }
.hero-delta { font-size: 14px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-top: 16px; }
.tile { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; }
.tile .t-label { font-size: 12.5px; color: var(--ink-2); }
.tile .t-value { font-size: 22px; font-weight: 650; margin-top: 2px; overflow-wrap: anywhere; }
.tile .t-sub { font-size: 12.5px; margin-top: 2px; color: var(--ink-2); }

.empty { text-align: center; padding: 40px 16px; }
.empty h2 { font-size: 20px; margin-bottom: 8px; }
.empty p { color: var(--ink-2); margin-bottom: 16px; max-width: 46ch; margin-inline: auto; }

/* ---------- 圖表 ---------- */
.chart-body { min-height: 296px; }
.bars-body.chartmode { min-height: 344px; }
.chart-body.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-2); }
.legend { display: flex; gap: 16px; font-size: 13px; margin-bottom: 6px; color: var(--ink-2); }
.legend.wrap { flex-wrap: wrap; gap: 6px 16px; margin: 10px 0 0; }
.lg-item { display: inline-flex; align-items: center; gap: 6px; }
.lg-line { width: 14px; height: 2px; border-radius: 1px; display: inline-block; }
.lg-box { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
svg.chart, svg.alloc { display: block; width: 100%; height: auto; max-width: 100%; }
.chart:focus-visible { outline-offset: 4px; border-radius: 4px; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .axis { stroke: var(--axis); stroke-width: 1; }
.chart .tick { fill: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.chart .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart .endlabel { fill: var(--ink); font-size: 12px; font-weight: 600; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; font-variant-numeric: tabular-nums; }
.chart .cross { stroke: var(--axis); stroke-width: 1; }
.chart .overlay { fill: transparent; touch-action: pan-y; cursor: crosshair; }
.chart .bar.cost { fill: var(--cost-fill); stroke: var(--cost-stroke); stroke-width: 1; }
.chart .bar.profit { fill: var(--st-good); }
.chart .bar.loss { fill: var(--st-bad); }
.chart .bargrp { transition: opacity 0.12s; }
.chart .bargrp.hot { opacity: 0.78; }
.chart .vlabel { fill: var(--ink); font-size: 11.5px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chart .xlabel { fill: var(--ink-2); font-size: 12px; font-weight: 600; }
.chart .hit { fill: transparent; }
.chart .hit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }
.lg-box.cost { background: var(--cost-fill); border: 1px solid var(--cost-stroke); }
.mini-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }
.mini { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px 6px; min-width: 0; }
.mini-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 2px; flex-wrap: wrap; }
.mini-head .asset { margin-right: auto; }
.mini-val { font-weight: 650; }
.mini-pnl { font-size: 12.5px; }
.mini-body { min-height: 200px; }
.mini-body.placeholder { display: flex; align-items: center; justify-content: center; color: var(--ink-2); font-size: 13px; }
.p-good { color: var(--txt-green); }
.p-bad { color: var(--txt-red); }
.alloc .seg { transition: filter 0.12s; }
.alloc .seg.hot { filter: brightness(1.12); }
.alloc .hit { fill: transparent; }
.alloc .hit:focus-visible { outline: none; stroke: var(--accent); stroke-width: 2; }

.tip { position: fixed; left: 0; top: 0; z-index: 100; pointer-events: none; background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; min-width: 170px;
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18); }
.tip[hidden] { display: none; }
.tip-head { font-size: 12px; color: var(--ink-2); margin-bottom: 4px; }
.tip-row { display: flex; align-items: center; gap: 8px; padding: 1px 0; }
.tip-key { width: 12px; height: 3px; border-radius: 2px; flex: none; }
.tip-key.none { background: none; }
.tip-label { color: var(--ink-2); margin-right: auto; }
.tip-val { font-variant-numeric: tabular-nums; }
.tip-val.strong { font-weight: 650; }

/* ---------- 表格 ---------- */
.tablewrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th { text-align: right; font-weight: 500; color: var(--ink-2); font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--axis); white-space: nowrap; }
td { text-align: right; padding: 9px 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; vertical-align: middle; }
th:first-child, td:first-child { text-align: left; }
th.l, td.l { text-align: left; }
tfoot td { font-weight: 650; border-bottom: 0; }
tbody tr:hover { background: var(--hover); }
.asset { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; }
.badge { font-size: 11px; font-weight: 500; padding: 0 6px; border-radius: 4px; border: 1px solid var(--border); color: var(--ink-2); }
.tag { display: inline-block; font-size: 12px; font-weight: 600; padding: 1px 8px; border-radius: 4px; }
.tag.buy { background: color-mix(in srgb, var(--c1) 14%, transparent); }
.tag.sell { background: color-mix(in srgb, var(--c2) 18%, transparent); }
.note { max-width: 14ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
td.act { white-space: nowrap; }
tr.bad td { background: color-mix(in srgb, var(--st-bad) 8%, transparent); }
.txbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 8px; }
select, input[type="text"], input[type="number"], input[type="datetime-local"], input[type="password"] {
  min-height: 36px; padding: 5px 10px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); width: 100%;
}
.card-head select { width: auto; min-width: 9em; }
.inline input { flex: 1; min-width: 0; }
.hint { font-size: 12.5px; }

/* ---------- 對話框 ---------- */
dialog.dlg { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); color: var(--ink); padding: 0;
  width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); }
dialog.dlg::backdrop { background: rgba(0, 0, 0, 0.5); }
.dlg-in { padding: 20px; }
.dlg h2 { font-size: 18px; margin-bottom: 4px; }
.dlg .lead { color: var(--ink-2); font-size: 13.5px; margin-bottom: 14px; }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 18px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; margin-bottom: 12px; }
.field > label, .field > .flabel { font-size: 13px; color: var(--ink-2); }
.field .hint { font-size: 12px; color: var(--ink-2); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.inline { display: flex; gap: 8px; align-items: center; }
.err { color: var(--danger); font-size: 13px; min-height: 1.2em; margin-top: 6px; }
.sec { border-top: 1px solid var(--grid); padding-top: 14px; margin-top: 14px; }
.sec h3 { font-size: 14px; margin-bottom: 8px; }
.btnrow { display: flex; flex-wrap: wrap; gap: 8px; }
.total-line { font-size: 13px; color: var(--ink-2); margin: -4px 0 10px; }

.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  padding: 8px 16px; border-radius: 999px; font-size: 13.5px; z-index: 200; max-width: calc(100vw - 32px); }

/* ---------- 鎖定畫面 ---------- */
.lock { min-height: 100vh; min-height: 100dvh; display: flex; align-items: center; justify-content: center; padding: 16px; }
.lock-card { width: min(360px, 100%); text-align: center; }
.lock-card h1 { font-size: 22px; margin: 12px 0 4px; }
.lock-sub { color: var(--ink-2); margin-bottom: 20px; min-height: 1.5em; }
.pin-dots { display: flex; justify-content: center; gap: 16px; margin-bottom: 8px; }
.pin-dot { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink-3); }
.pin-dot.on { background: var(--ink); border-color: var(--ink); }
.pin-dots.shake { animation: shake 0.35s; }
@keyframes shake { 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(5px); } }
.lock-msg { min-height: 1.6em; font-size: 13.5px; color: var(--ink-2); margin-bottom: 12px; }
.lock-msg.err { color: var(--danger); }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 280px; margin: 0 auto 16px; }
.key { width: 72px; height: 72px; justify-self: center; border-radius: 50%; border: 1px solid var(--border); background: var(--surface); font-size: 22px; cursor: pointer;
  display: flex; align-items: center; justify-content: center; touch-action: manipulation; }
.key:hover { background: var(--hover); }
.key:active { background: var(--axis); }
.key.util { font-size: 13px; color: var(--ink-2); }
.key[disabled] { opacity: 0.4; cursor: default; }
.lock-foot { font-size: 12px; color: var(--ink-2); margin-top: 8px; }

/* ---------- 手機：表格改卡片 ---------- */
@media (max-width: 760px) {
  .card { padding: 14px 12px; }
  table.rt thead { display: none; }
  table.rt, table.rt tbody, table.rt tr, table.rt td, table.rt tfoot { display: block; width: 100%; }
  table.rt tr { border: 1px solid var(--grid); border-radius: 10px; padding: 8px 10px; margin-bottom: 10px; }
  table.rt td { display: flex; justify-content: space-between; align-items: center; gap: 12px; border: 0; padding: 3px 0; text-align: right; }
  table.rt td::before { content: attr(data-label); color: var(--ink-2); font-size: 12.5px; text-align: left; flex: none; }
  table.rt td:first-child { font-size: 15px; padding-bottom: 6px; }
  table.rt td:first-child::before { content: none; }
  table.rt td.act { justify-content: flex-end; }
  table.rt td.act::before { content: none; }
  table.rt .note { max-width: 60%; }
  table.rt tfoot tr { background: var(--hover); }
  .row2 { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
.holdings tfoot td, table tfoot td{white-space:nowrap}

/* ---------- 篩選 / 排序列、可排序表頭 ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
.toolbar[hidden], .toolbar .btn[hidden] { display: none; }
.toolbar select, .toolbar input { width: auto; min-width: 0; }
.toolbar input.q { flex: 1 1 11em; max-width: 18em; }
.toolbar .dlab { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--ink-2); }
.toolbar input[type="date"] { min-height: 36px; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); }
.thsort { border: 0; background: none; padding: 0; margin: 0; font: inherit; color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.thsort:hover { color: var(--ink); text-decoration: underline; }
.thsort:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px; }
.thsort.on { color: var(--ink); font-weight: 650; }
.sarr { font-size: 12px; }

/* ---------- 調整版面對話框 ---------- */
.order-list { list-style: none; margin: 0 0 16px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.order-item { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; background: var(--surface); }
.order-item .oname { margin-right: auto; font-weight: 550; }
.order-item .grip { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; cursor: grab; color: var(--ink-2); touch-action: none; user-select: none; border-radius: 6px; }
.order-item .grip:hover { background: var(--hover); }
.order-item.dragging { background: var(--hover); border-color: var(--accent); box-shadow: 0 4px 14px rgba(0,0,0,.18); }
.order-item.dragging .grip { cursor: grabbing; }
@media (max-width: 760px) {
  .toolbar .dlab { flex: 1 1 42%; }
  .toolbar .dlab input { flex: 1; min-width: 0; }
  .toolbar select { flex: 1 1 8em; }
}

/* ---------- 雲端同步 ---------- */
.syncchip { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.syncchip[hidden] { display: none; }
.syncchip.ok { color: var(--ink-2); }
.syncchip.syncing svg { animation: spin 1s linear infinite; }
.syncchip.pending { color: var(--ink-2); font-style: italic; }
.syncchip.error { color: var(--danger); border-color: var(--danger); }
@keyframes spin { to { transform: rotate(360deg); } }
.howto { margin: 6px 0 12px; font-size: 13px; color: var(--ink-2); }
.howto summary { cursor: pointer; color: var(--accent); }
.howto ol { margin: 8px 0 0 18px; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.codebox { width: 100%; font-family: ui-monospace, monospace; font-size: 12px; word-break: break-all; border: 1px solid var(--axis); border-radius: 8px; padding: 8px; background: var(--surface); color: var(--ink); }

</style>
</head>
<body>
<div id="root"></div>
<noscript>這個網頁需要啟用 JavaScript。</noscript>
<script>
/* ===== util.js ===== */
/* ------------------------------------------------------------------
 * Util：DOM 建構、格式化、刻度計算。所有使用者資料一律以 textContent 寫入。
 * ------------------------------------------------------------------ */
const SVG_NS = 'http://www.w3.org/2000/svg';

function h(tag, props) {
  const el = document.createElement(tag);
  applyProps(el, props);
  appendChildren(el, Array.prototype.slice.call(arguments, 2));
  return el;

      const fx = fxOf(tx);
      const price = tx.price * fx;
      const fee = (tx.fee || 0) * fx;

      if (p.firstTs == null) p.firstTs = tx.ts;
      p.lastPrice = price;
      p.fees += fee;

        p.cost += total;
        p.boughtQty += tx.qty;

/* ------------------------------------------------------------------
 * SyncCore：雲端同步的純函式（無網路、無 DOM，可在 node 單元測試）
 *  - 每筆交易帶 u（最後修改時間），刪除留下墓碑 deleted[id]，手動價格帶 at
 *  - merge：兩邊各自改動後合併，以「最後修改者勝」處理同一筆的衝突
 * ------------------------------------------------------------------ */

  const TX_KEYS = ['ts', 'type', 'asset', 'qty', 'price', 'fee', 'fx', 'note'];

  function sameTx(a, b) {
    return TX_KEYS.every((k) => (a[k] == null ? null : a[k]) === (b[k] == null ? null : b[k]));
  }
  function cleanTx(t) {
    return { id: t.id, ts: t.ts, type: t.type, asset: t.asset, qty: t.qty, price: t.price, fee: t.fee || 0, fx: t.fx == null ? null : t.fx, note: t.note || '', u: t.u > 0 ? +t.u : 0 };

  /** 本機資料 → 要同步的內容（只含交易、刪除墓碑、手動價格；不含設定與 Token） */
  function payloadOf(d) {
    const txs = (d.txs || []).map(cleanTx).sort((a, b) => (a.id < b.id ? -1 : a.id > b.id ? 1 : 0));
    const deleted = {};
    Object.keys(d.deleted || {}).sort().forEach((id) => { deleted[id] = +d.deleted[id]; });
    const mp = {};
    const assets = {};
    Object.keys(d.manualPrices || {}).forEach((a) => { assets[a] = 1; });
    Object.keys(d.mpAt || {}).forEach((a) => { assets[a] = 1; });
    Object.keys(assets).sort().forEach((a) => {
      const p = d.manualPrices && d.manualPrices[a] > 0 ? +d.manualPrices[a] : null;
      mp[a] = { p, at: (d.mpAt && +d.mpAt[a]) || 0 };

    return { v: 1, txs, deleted, mp };
  }

  function canon(p) { return JSON.stringify(p); }

  function pickNewer(a, b, key) {
    if (!a) return b;
    if (!b) return a;
    if ((b[key] || 0) > (a[key] || 0)) return b;
    if ((b[key] || 0) < (a[key] || 0)) return a;
    // 時間相同：用內容決定，確保兩台裝置合併結果一致
    return JSON.stringify(b) > JSON.stringify(a) ? b : a;
  }

  function merge(a, b) {
    const deleted = {};
    [a.deleted, b.deleted].forEach((m) => Object.keys(m || {}).forEach((id) => { deleted[id] = Math.max(deleted[id] || 0, +m[id] || 0); }));
    const byId = {};
    [a.txs, b.txs].forEach((list) => (list || []).forEach((t) => { byId[t.id] = pickNewer(byId[t.id], t, 'u'); }));
    const txs = [];
    Object.keys(byId).forEach((id) => {
      const t = byId[id];
      if (deleted[id] != null) {
        if (deleted[id] >= (t.u || 0)) return;   // 刪除比最後修改新（或一樣新）→ 維持刪除
        delete deleted[id];                       // 刪除之後又被修改 → 復活
      }
      txs.push(cleanTx(t));
    });
    txs.sort((x, y) => (x.id < y.id ? -1 : x.id > y.id ? 1 : 0));
    const mp = {};
    const assets = {};
    Object.keys(a.mp || {}).forEach((k) => { assets[k] = 1; });
    Object.keys(b.mp || {}).forEach((k) => { assets[k] = 1; });
    Object.keys(assets).sort().forEach((k) => {
      const win = pickNewer(a.mp && a.mp[k], b.mp && b.mp[k], 'at');
      mp[k] = { p: win.p > 0 ? +win.p : null, at: win.at || 0 };
    });

    Object.keys(deleted).sort().forEach((id) => { dl[id] = deleted[id]; });
    return { v: 1, txs, deleted: dl, mp };
  }

/* ------------------------------------------------------------------
 * Vault：以 4 位數密碼（PBKDF2 → AES-GCM）加密後存進瀏覽器 localStorage。
 * 資料只存在這台裝置的瀏覽器裡，不會上傳到 GitHub 或任何伺服器。
 * ------------------------------------------------------------------ */
const Vault = (function () {
  const K_DATA = 'cryptoledger.vault.v1';
  const K_META = 'cryptoledger.meta.v1';
  const ITER = 250000;
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function store() {
    try { return window.localStorage; } catch (e) { return null; }
  }
  function get(k) { const st = store(); try { return st ? st.getItem(k) : null; } catch (e) { return null; } }
  function set(k, v) {
    const st = store();
    if (!st) throw new Error('NO_STORAGE');
    st.setItem(k, v);
  }
  function del(k) { const st = store(); try { if (st) st.removeItem(k); } catch (e) { /* ignore */ } }

  function toB64(buf) {
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromB64(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  function supported() {
    return !!(window.crypto && crypto.subtle && store());
  }

  async function deriveKey(pin, salt, iter) {
    const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: iter, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  async function seal(session, data) {
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, session.key, enc.encode(JSON.stringify(data)));
    return { v: 1, iter: session.iter, salt: toB64(session.salt), iv: toB64(iv), ct: toB64(ct) };
  }

  async function openEnvelope(env, pin) {
    if (!env || env.v !== 1 || !env.salt || !env.iv || !env.ct) throw new Error('BAD_FORMAT');
    const salt = fromB64(env.salt);
    const iter = env.iter || ITER;
    const key = await deriveKey(pin, salt, iter);
    let plain;
    try {
      plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(env.iv) }, key, fromB64(env.ct));
    } catch (e) { throw new Error('BAD_PIN'); }
    return { session: { key, salt, iter }, data: JSON.parse(dec.decode(plain)) };
  }

  function has() { return !!get(K_DATA); }

  async function create(pin, data) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const session = { key: await deriveKey(pin, salt, ITER), salt, iter: ITER };
    set(K_DATA, JSON.stringify(await seal(session, data)));
    return session;
  }

  async function save(session, data) {
    set(K_DATA, JSON.stringify(await seal(session, data)));
  }

  async function unlock(pin) {
    const raw = get(K_DATA);
    if (!raw) throw new Error('NO_VAULT');
    return openEnvelope(JSON.parse(raw), pin);
  }

  /** 換密碼：以新 PIN 與新 salt 重新加密同一份資料 */
  async function rekey(newPin, data) {
    return create(newPin, data);
  }

  function exportBackup() { return get(K_DATA); }
  /** 以目前 session 的金鑰把指定資料封成備份（用來匯出「不含同步 Token」的備份） */
  async function exportSealed(session, data) { return JSON.stringify(await seal(session, data)); }

  /* ---- 雲端同步用：任意密碼加密／解密（與本機保險庫分開，salt 由雲端檔案決定） ---- */
  async function newSession(pw) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    return { key: await deriveKey(pw, salt, ITER), salt, iter: ITER };
  }
  async function sealWith(session, data) { return seal(session, data); }
  /** 解開信封；若 salt 與快取的 session 相同就直接用快取金鑰（省掉 25 萬次 PBKDF2） */
  async function openAny(env, pw, cached) {
    if (cached && env && env.salt === toB64(cached.salt) && (env.iter || ITER) === cached.iter) {
      let plain;
      try { plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: fromB64(env.iv) }, cached.key, fromB64(env.ct)); }
      catch (e) { throw new Error('BAD_PIN'); }
      return { session: cached, data: JSON.parse(dec.decode(plain)) };
    }
    return openEnvelope(env, pw);
  }

  /** 解密備份檔（需輸入建立該備份時的密碼），回傳資料物件 */
  async function readBackup(text, pin) {
    let env;
    try { env = JSON.parse(text); } catch (e) { throw new Error('BAD_FORMAT'); }
    const r = await openEnvelope(env, pin);
    return r.data;
  }

  function reset() { del(K_DATA); del(K_META); }

  /* ---- 嘗試次數與鎖定（僅為前端層級的減速帶） ---- */
  function meta() {
    try { return JSON.parse(get(K_META)) || { fails: 0, until: 0 }; } catch (e) { return { fails: 0, until: 0 }; }
  }
  function lockRemainingMs() { return Math.max(0, meta().until - Date.now()); }
  function recordFail() {
    const m = meta();
    m.fails = (m.fails || 0) + 1;
    if (m.fails % 5 === 0) {
      const level = Math.floor(m.fails / 5) - 1;
      m.until = Date.now() + Math.min(30 * Math.pow(2, level), 3600) * 1000;
    }
    try { set(K_META, JSON.stringify(m)); } catch (e) { /* ignore */ }
    return { fails: m.fails, remainingTries: 5 - (m.fails % 5), lockedMs: Math.max(0, m.until - Date.now()) };
  }
  function clearFails() { del(K_META); }

  return { supported, has, create, save, unlock, rekey, exportBackup, exportSealed, newSession, sealWith, openAny, readBackup, reset, lockRemainingMs, recordFail, clearFails };
})();

/* ------------------------------------------------------------------
 * Market：幣安公開行情（不需 API Key）＋ USD/TWD 匯率
 * ------------------------------------------------------------------ */
const Market = (function () {
  // 依序嘗試；data-api.binance.vision 是幣安專為「只讀行情」提供的網域
  const BASES = [
    'https://api.binance.com',
    'https://data-api.binance.vision',
    'https://api1.binance.com',
    'https://api2.binance.com',
    'https://api3.binance.com',
  ];
  const FX_URL = 'https://open.er-api.com/v6/latest/USD';
  const FX_KEY = 'cryptoledger.fx.v1';
  let baseIdx = 0;

  async function fetchWithTimeout(url, ms) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms || 8000);
    try { return await fetch(url, { signal: ctl.signal, cache: 'no-store', credentials: 'omit', referrerPolicy: 'no-referrer' }); }
    finally { clearTimeout(timer); }
  }

  async function getJSON(path, params) {
    const qs = new URLSearchParams(params || {}).toString();
    let lastErr = null;
    for (let i = 0; i < BASES.length; i++) {
      const idx = (baseIdx + i) % BASES.length;
      try {
        const res = await fetchWithTimeout(BASES[idx] + path + (qs ? '?' + qs : ''));
        if (res.ok) { baseIdx = idx; return await res.json(); }
        if (res.status === 400) { const e = new Error('BAD_REQUEST'); e.status = 400; throw e; } // 例如無此交易對
        lastErr = new Error('HTTP ' + res.status);
        lastErr.status = res.status;
      } catch (e) {
        if (e.status === 400) throw e;
        lastErr = e;
      }
    }
    throw lastErr || new Error('NETWORK');
  }

  /** 取得多個幣種（對 USDT）的最新價與 24h 漲跌幅 */
  async function fetchTickers(assets) {
    const list = assets.filter((a) => a !== 'USDT');
    const prices = {};
    const unknown = [];
    if (!list.length) return { prices, unknown };
    try {
      const arr = await getJSON('/api/v3/ticker/24hr', { symbols: JSON.stringify(list.map((a) => a + 'USDT')) });
      for (const t of arr) prices[t.symbol.slice(0, -4)] = { price: parseFloat(t.lastPrice), pct: parseFloat(t.priceChangePercent) };
    } catch (e) {
      if (e.status !== 400) throw e;
      // 其中有交易對不存在：逐一查詢，找出哪些沒有報價
      let netErr = null;
      await Promise.all(list.map(async (a) => {
        try {
          const t = await getJSON('/api/v3/ticker/24hr', { symbol: a + 'USDT' });
          prices[a] = { price: parseFloat(t.lastPrice), pct: parseFloat(t.priceChangePercent) };
        } catch (e2) {
          if (e2.status === 400) unknown.push(a); else netErr = e2;
        }
      }));
      if (netErr && !Object.keys(prices).length) throw netErr;
    }
    for (const a of list) if (!prices[a] && unknown.indexOf(a) < 0) unknown.push(a);
    return { prices, unknown };
  }

  /** 日 K（UTC 日界）。回傳 [{open, close}]，open 為當日 00:00 UTC 的毫秒時間戳 */
  async function fetchDailyCloses(asset, startTs) {
    const out = [];
    let start = startTs;
    for (let page = 0; page < 5; page++) {
      const arr = await getJSON('/api/v3/klines', { symbol: asset + 'USDT', interval: '1d', startTime: String(start), limit: '1000' });
      for (const k of arr) out.push({ open: k[0], close: parseFloat(k[4]) });
      if (arr.length < 1000) break;
      start = arr[arr.length - 1][6] + 1;
    }
    return out;
  }

  function cachedFx() {
    try { const j = JSON.parse(localStorage.getItem(FX_KEY)); if (j && j.rate > 0) return j; } catch (e) { /* ignore */ }
    return null;
  }

  async function fetchFx() {
    const res = await fetchWithTimeout(FX_URL, 8000);
    if (!res.ok) throw new Error('FX HTTP ' + res.status);
    const j = await res.json();
    const rate = j && j.rates && j.rates.TWD;
    if (!(rate > 0)) throw new Error('FX BAD');
    const out = { rate, ts: (j.time_last_update_unix ? j.time_last_update_unix * 1000 : Date.now()) };
    try { localStorage.setItem(FX_KEY, JSON.stringify(out)); } catch (e) { /* ignore */ }
    return out;
  }

  return { fetchTickers, fetchDailyCloses, fetchFx, cachedFx };
})();

  if (!compact_) container.appendChild(legend);
  container.appendChild(svg);
}

  const Y = (v) => m.t + ih - ((v - nt.min) / (nt.max - nt.min)) * ih;
  const lastDay = Math.floor(maxD + 0.5);

  const desc = series.map((se) => {
    const last = se.pts[se.pts.length - 1];
    return se.asset + ' 目前 ' + fmtPct(last.pct, true);
  }).join('、');
  const svg = s('svg', {
    class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'img', tabindex: 0,
    'aria-label': '各幣種報酬率變化（持有第 0 至第 ' + lastDay + ' 天）：' + desc + '。可用左右方向鍵逐日瀏覽。',
  });

  nt.ticks.forEach((v) => {
    const y = Y(v);
    svg.appendChild(s('line', { class: Math.abs(v) < 1e-9 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, pctTick(v)));
  });
  // X 軸刻度：整數天
  const xt = niceTicks(0, maxD, 6).ticks.filter((v) => v >= 0 && v <= maxD + 1e-9 && Math.abs(v - Math.round(v)) < 1e-9);
  xt.forEach((v, i) => {
    const anchor = v === 0 ? 'start' : (i === xt.length - 1 && X(v) > W - m.r - 16) ? 'end' : 'middle';
    svg.appendChild(s('text', { class: 'tick', x: X(v), y: H - 12, 'text-anchor': anchor }, '第 ' + Math.round(v) + ' 天'));
  });

  // 折線：null（已清倉）處斷開
  series.forEach((se) => {
    let d = '', pen = false;
    se.pts.forEach((p) => {
      if (p.pct == null) { pen = false; return; }
      d += (pen ? 'L' : 'M') + X(p.d).toFixed(1) + ' ' + Y(p.pct).toFixed(1);
      pen = true;
    });
    svg.appendChild(s('path', { class: 'line', d, style: { stroke: se.color } }));
    const last = se.pts[se.pts.length - 1];
    if (last.pct != null) svg.appendChild(s('circle', { class: 'dot', cx: X(last.d), cy: Y(last.pct), r: 4, style: { fill: se.color } }));
  });

  const cross = s('line', { class: 'cross', y1: m.t, y2: m.t + ih, x1: 0, x2: 0, visibility: 'hidden' });
  svg.appendChild(cross);
  const hdots = series.map((se) => {
    const c = s('circle', { class: 'dot', r: 4, visibility: 'hidden', style: { fill: se.color } });
    svg.appendChild(c);
    return c;
  });
  const overlay = s('rect', { class: 'overlay', x: m.l, y: m.t, width: iw, height: ih });
  svg.appendChild(overlay);

  let cur_i = lastDay;
  function showAt(day, fromKeyboard) {
    day = Math.max(0, Math.min(lastDay, day));
    cur_i = day;
    const px = X(Math.min(day, maxD));
    cross.setAttribute('x1', px); cross.setAttribute('x2', px); cross.setAttribute('visibility', 'visible');
    const rows = [];
    series.forEach((se, i) => {
      const p = retAt(se.pts, day);
      if (p && p.pct != null) {
        hdots[i].setAttribute('cx', X(p.d)); hdots[i].setAttribute('cy', Y(p.pct)); hdots[i].setAttribute('visibility', 'visible');
        rows.push({ se, pct: p.pct, ts: p.ts });
      } else hdots[i].setAttribute('visibility', 'hidden');
    });
    rows.sort((a, b) => b.pct - a.pct);
    const r = svg.getBoundingClientRect();
    const cx = r.left + (px / W) * r.width;
    const cy = r.top + (rows.length ? Y(rows[0].pct) / H * r.height : m.t);
    Tip.show(cx, cy, [h('div', { class: 'tip-head' }, '持有第 ' + day + ' 天')].concat(
      rows.length ? rows.map((x) => tipRow(x.se.color, x.se.asset, fmtPct(x.pct, true), true)) : [tipRow(null, '這天沒有持倉', '', false)]));
    if (fromKeyboard) svg.setAttribute('data-idx', day);
  }
  function hideAll() {
    cross.setAttribute('visibility', 'hidden');
    hdots.forEach((c) => c.setAttribute('visibility', 'hidden'));
    Tip.hide();
  }
  function dayOf(clientX) {
    const r = svg.getBoundingClientRect();
    const px = ((clientX - r.left) / r.width) * W;
    return Math.round(((px - m.l) / iw) * maxD);
  }
  overlay.addEventListener('pointermove', (e) => showAt(dayOf(e.clientX)));
  overlay.addEventListener('pointerdown', (e) => showAt(dayOf(e.clientX)));
  overlay.addEventListener('pointerleave', hideAll);
  overlay.addEventListener('pointercancel', hideAll);
  svg.addEventListener('focus', () => showAt(cur_i, true));
  svg.addEventListener('blur', hideAll);
  svg.addEventListener('keydown', (e) => {
    let d = cur_i;
    if (e.key === 'ArrowLeft') d = Math.max(0, d - 1);
    else if (e.key === 'ArrowRight') d = Math.min(lastDay, d + 1);
    else if (e.key === 'Home') d = 0;
    else if (e.key === 'End') d = lastDay;
    else return;
    e.preventDefault();
    showAt(d, true);
  });

  const legend = h('div', { class: 'legend wrap' }, series.map((se) => {
    const last = se.pts[se.pts.length - 1];
    return h('span', { class: 'lg-item' }, h('span', { class: 'lg-line', style: { background: se.color } }), se.asset,
      last.pct != null ? h('span', { class: 'num ' + signClass(last.pct) }, fmtPct(last.pct, true)) : null);
  }));
  container.appendChild(legend);
  container.appendChild(svg);
}

/* ================= 資產配置（單一橫向堆疊條） ================= */
function allocBar(container, rows, o) {
  clear(container);
  const cur = o.cur;
  const priced = rows.filter((r) => r.value > 0);
  const total = priced.reduce((a, r) => a + r.value, 0);
  if (!(total > 0)) { container.appendChild(h('p', { class: 'muted' }, '尚無可估值的持倉。')); return; }

  const segs = [];
  const other = { asset: '其他', value: 0, names: [], color: 'var(--c-other)' };
  for (const r of priced) {
    const color = o.colorOf(r.asset);
    if (color && r.value / total >= 0.015) segs.push({ asset: r.asset, value: r.value, color });
    else { other.value += r.value; other.names.push(r.asset); }
  }
  if (other.value > 0) segs.push(other);

  const W = Math.max(container.clientWidth || 600, 240), H = 32, barY = 6, barH = 20;
  const clipId = 'allocClip' + Math.floor(Math.random() * 1e9);
  const svg = s('svg', { class: 'alloc', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': '資產配置比例' });
  svg.appendChild(s('defs', null, s('clipPath', { id: clipId }, s('rect', { x: 0, y: barY, width: W, height: barH, rx: 4, ry: 4 }))));
  const g = s('g', { 'clip-path': 'url(#' + clipId + ')' });
  svg.appendChild(g);

  let x = 0;
  segs.forEach((sg, i) => {
    const w = (sg.value / total) * W;
    const gapL = i > 0 ? 1 : 0, gapR = i < segs.length - 1 ? 1 : 0;
    const seg = s('rect', { class: 'seg', x: x + gapL, y: barY, width: Math.max(w - gapL - gapR, 0.5), height: barH, style: { fill: sg.color } });
    g.appendChild(seg);
    const share = sg.value / total;
    const label = sg.asset + ' ' + fmtPct(share);
    const hit = s('rect', { class: 'hit', x, y: 0, width: Math.max(w, 1), height: H, tabindex: 0, role: 'img', 'aria-label': label + '，市值 ' + fmtMoney(sg.value, cur) });
    const show = (cx, cy) => {
      seg.classList.add('hot');
      const rowsEl = [
        h('div', { class: 'tip-head' }, sg.asset + (sg.names ? '（' + sg.names.join('、') + '）' : '')),
        tipRow(sg.color, '市值', fmtMoney(sg.value, cur), true),
        tipRow(null, '占比', fmtPct(share), false),
      ];
      Tip.show(cx, cy, rowsEl);
    };
    const hide = () => { seg.classList.remove('hot'); Tip.hide(); };
    hit.addEventListener('pointermove', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerdown', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); show(r.left + r.width / 2, r.top); });
    hit.addEventListener('blur', hide);
    svg.appendChild(hit);
    x += w;
  });

  const legend = h('div', { class: 'legend wrap' }, segs.map((sg) =>
    h('span', { class: 'lg-item' },
      h('span', { class: 'lg-box', style: { background: sg.color } }),
      h('span', null, sg.asset),
      h('span', { class: 'muted num' }, fmtPct(sg.value / total)))));
  container.appendChild(svg);
  container.appendChild(legend);
}

/* ================= 各幣種：成本 / 盈虧 直條圖 ================= */
function topRoundPath(x, y, w, h, r) {
  r = Math.max(0, Math.min(r, h, w / 2));
  return 'M' + x + ' ' + (y + h) + 'V' + (y + r) + 'Q' + x + ' ' + y + ' ' + (x + r) + ' ' + y +
    'H' + (x + w - r) + 'Q' + (x + w) + ' ' + y + ' ' + (x + w) + ' ' + (y + r) + 'V' + (y + h) + 'Z';
}
function barLabel(b) {
  if (b.recovered) return b.bought > Engine.EPS ? '已回本' : '零成本';
  return fmtPct(b.pct, true);
}
function assetBarChart(container, allBars, o) {
  clear(container);
  const cur = o.cur;
  const pct = o.mode === 'pct';               // pct：每根以「累計買入」為 100%，方便比較不同大小的幣種
  const bars = pct ? allBars.filter((b) => b.bought > Engine.EPS) : allBars;
  const K = (b) => (pct ? 1 / b.bought : 1);
  const n = bars.length;
  if (!n) { container.appendChild(h('p', { class: 'muted' }, '沒有可用「報酬率」表示的幣種（零成本幣種請切回金額檢視）。')); return; }
  const W = Math.max(container.clientWidth || 600, 260), H = 300;
  const m = { t: 30, r: 12, b: 32, l: pct ? 52 : (cur === 'TWD' ? 60 : 56) };
  const iw = W - m.l - m.r, ih = H - m.t - m.b;
  const maxH = Math.max.apply(null, bars.map((b) => b.height * K(b)));
  const nt = niceTicks(0, maxH > 0 ? maxH : 1, 5);
  const Y = (v) => m.t + ih - (v / nt.max) * ih;
  const slot = iw / n, bw = Math.min(40, slot * 0.6);
  const showLabels = slot >= 54;
  const tickText = (v) => (pct ? num(v * 100, 0, 0) + '%' : compact(v, cur));

  const svg = s('svg', { class: 'chart', viewBox: '0 0 ' + W + ' ' + H, width: W, height: H, role: 'group', 'aria-label': '各幣種成本與盈虧直條圖' });
  nt.ticks.forEach((v, i) => {
    const y = Y(v);
    svg.appendChild(s('line', { class: i === 0 ? 'axis' : 'grid', x1: m.l, x2: W - m.r, y1: y, y2: y }));
    svg.appendChild(s('text', { class: 'tick', x: m.l - 8, y: y + 4, 'text-anchor': 'end' }, tickText(v)));
  });

  bars.forEach((b, i) => {
    const k = K(b);
    const cx = m.l + slot * (i + 0.5), x = cx - bw / 2;
    const segs = [];
    if (b.white > 0) segs.push({ kind: 'cost', v: b.white * k });
    if (b.profit > 0) segs.push({ kind: 'profit', v: b.profit * k });
    if (b.loss > 0) segs.push({ kind: 'loss', v: b.loss * k });
    const g = s('g', { class: 'bargrp' });
    let cursor = Y(0);
    segs.forEach((sg, j) => {
      const hpx = Math.max(2, (sg.v / nt.max) * ih);
      const top = cursor - hpx;
      const isTop = j === segs.length - 1;
      const y = top + (isTop ? 0 : 1);
      const hh = Math.max(1, hpx - (isTop ? 0 : 1) - (j > 0 ? 1 : 0));
      g.appendChild(s('path', { class: 'bar ' + sg.kind, d: isTop ? topRoundPath(x, y, bw, hh, 4) : 'M' + x + ' ' + y + 'h' + bw + 'v' + hh + 'h' + (-bw) + 'Z' }));
      cursor = top;
    });
    svg.appendChild(g);
    if (showLabels) svg.appendChild(s('text', { class: 'vlabel', x: cx, y: cursor - 7, 'text-anchor': 'middle' }, barLabel(b)));
    svg.appendChild(s('text', { class: 'xlabel', x: cx, y: H - 10, 'text-anchor': 'middle' }, b.asset));

    const hit = s('rect', {
      class: 'hit', x: m.l + slot * i, y: 0, width: slot, height: H - 20, tabindex: 0, role: 'img',
      'aria-label': b.asset + '：' + (b.recovered ? '已回本，' : '') + '目前市值 ' + fmtMoney(b.value, cur) + '，總損益 ' + fmtSigned(b.pnl, cur),
    });
    const show = (cx2, cy2) => {
      g.classList.add('hot');
      const rows = [h('div', { class: 'tip-head' }, b.asset + (b.recovered ? '　已取回成本' : ''))];
      rows.push(tipRow(null, '累計買入', fmtMoney(b.bought, cur), false));
      if (b.sold > 0) rows.push(tipRow(null, '已賣出回收', fmtMoney(b.sold, cur), false));
      if (b.white > 0 && !b.recovered) rows.push(tipRow('var(--cost-fill)', b.loss > 0 ? '剩餘市值（成本部分）' : '尚未取回成本', fmtMoney(b.white, cur), false));
      rows.push(tipRow(null, '目前市值', fmtMoney(b.value, cur), true));
      rows.push(tipRow(b.pnl >= 0 ? 'var(--st-good)' : 'var(--st-bad)', b.pnl >= 0 ? '盈利' : '虧損',
        fmtSigned(b.pnl, cur) + (b.pct != null ? '（' + fmtPct(b.pct, true) + '）' : ''), true));
      Tip.show(cx2, cy2, rows);
    };
    const hide = () => { g.classList.remove('hot'); Tip.hide(); };
    hit.addEventListener('pointermove', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerdown', (e) => show(e.clientX, e.clientY));
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => { const r = hit.getBoundingClientRect(); show(r.left + r.width / 2, r.top + 40); });
    hit.addEventListener('blur', hide);
    svg.appendChild(hit);
  });

  const legend = h('div', { class: 'legend wrap' },
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-box cost' }), '尚未取回的成本'),
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-box', style: { background: 'var(--st-good)' } }), '盈利'),
    h('span', { class: 'lg-item' }, h('span', { class: 'lg-box', style: { background: 'var(--st-bad)' } }), '虧損'));
  container.appendChild(legend);
  container.appendChild(svg);
}

const $root = document.getElementById('root');

let session = null;      // { key, salt, iter }

/* ---------- 偏好（非敏感，明文存放：主題） ---------- */
const prefs = { theme: 'auto' };
function loadPrefs() {
  try { Object.assign(prefs, JSON.parse(localStorage.getItem(PREF_KEY)) || {}); } catch (e) { /* ignore */ }
  applyTheme();
}
function savePrefs() { try { localStorage.setItem(PREF_KEY, JSON.stringify(prefs)); } catch (e) { /* ignore */ } }
function applyTheme() {
  const r = document.documentElement;

  else r.removeAttribute('data-theme');

/* ---------- 資料 ---------- */
function defaultData() {
  return { v: 1, settings: { cur: 'USDT', method: 'avg', range: 'ALL', ud: 'red-up', fxManual: null, idleMin: 5, order: null }, txs: [], manualPrices: {}, deleted: {}, mpAt: {}, sync: null };
}
function normalize(d) {
  const out = defaultData();
  d = d || {};
  Object.assign(out.settings, d.settings || {});
  out.settings.order = cleanOrder(out.settings.order);
  out.txs = (Array.isArray(d.txs) ? d.txs : []).filter((t) =>
    t && typeof t.id === 'string' && isFinite(t.ts) && (t.type === 'buy' || t.type === 'sell') &&
    typeof t.asset === 'string' && t.qty > 0 && isFinite(t.qty) && t.price >= 0 && isFinite(t.price)
  ).map((t) => ({
    id: t.id, ts: +t.ts, type: t.type, asset: t.asset.toUpperCase(), qty: +t.qty, price: +t.price,
    fee: t.fee > 0 ? +t.fee : 0, fx: t.fx > 0 ? +t.fx : null, note: typeof t.note === 'string' ? t.note.slice(0, 200) : '',
    u: t.u > 0 ? +t.u : 0,
  }));
  for (const id in (d.deleted || {})) if (d.deleted[id] > 0) out.deleted[id] = +d.deleted[id];
  for (const k in (d.mpAt || {})) if (d.mpAt[k] > 0) out.mpAt[k.toUpperCase()] = +d.mpAt[k];
  const sy = d.sync;
  if (sy && sy.owner && sy.repo && sy.token && sy.pw) out.sync = { owner: String(sy.owner), repo: String(sy.repo), token: String(sy.token), pw: String(sy.pw), path: 'ledger.sync.json' };
  const mp = d.manualPrices || {};
  for (const k in mp) if (mp[k] > 0) out.manualPrices[k.toUpperCase()] = +mp[k];
  return out;
}
function persist() {
  const snap = JSON.parse(JSON.stringify(data));

  saveChain = saveChain.then(() => Vault.save(sess, snap)).catch(() => toast('儲存失敗：瀏覽器可能已禁止儲存或空間已滿'));

}

function stampName() { const d = new Date(); return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()); }

/* ---------- 對話框 ---------- */
function modal(build) {

    const dlg = h('dialog', { class: 'dlg' });
    const close = (v) => { try { dlg.close(); } catch (e) { /* ignore */ } dlg.remove(); resolve(v); };
    dlg.addEventListener('cancel', (e) => { e.preventDefault(); close(undefined); });
    dlg.addEventListener('mousedown', (e) => { if (e.target === dlg) close(undefined); });
    dlg.appendChild(h('div', { class: 'dlg-in' }, build(close)));
    document.body.appendChild(dlg);

  });

    h('p', { class: 'lead' }, o.body),
    h('div', { class: 'dlg-actions' },

      h('button', { class: 'btn ' + (o.danger ? 'danger solid' : 'primary'), type: 'button', onclick: () => close(true) }, o.confirm || '確定')),

function pinField(id, label) {

function promptPin(title, lead) {

    const err = h('div', { class: 'err' });

    return [
      h('h2', null, title), h('p', { class: 'lead' }, lead),

}

/* ---------- 報價與計算 ---------- */
function fxEffective() {

  return market.fx ? market.fx.rate : null;
}
function effCur() { return data.settings.cur === 'TWD' && fxEffective() ? 'TWD' : 'USDT'; }

let lastPxCache = { v: -1, map: {} };
function lastTradePx() {
  if (lastPxCache.v !== dataVersion) {
    const map = {};
    for (const t of Engine.sortTx(data.txs)) map[t.asset] = t.price;
    lastPxCache = { v: dataVersion, map };
  }
  return lastPxCache.map;
}
/** 以 USDT 計的價格資訊：即時 > 手動 > 最近成交價 */
function priceInfo(asset) {
  if (asset === 'USDT') return { price: 1, pct: 0, src: 'live' };
  const m = market.prices[asset];
  if (m && m.price > 0) return { price: m.price, pct: m.pct, src: 'live' };
  const mp = data.manualPrices[asset];
  if (mp > 0) return { price: mp, pct: null, src: 'manual' };
  const lt = lastTradePx()[asset];
  if (lt > 0) return { price: lt, pct: null, src: 'trade' };
  return null;
}
function compute() {
  const cur = effCur();
  const fxNow = cur === 'TWD' ? fxEffective() : 1;
  const method = data.settings.method === 'fifo' ? 'fifo' : 'avg';
  const fxOf = cur === 'TWD' ? (t) => (t.fx > 0 ? t.fx : fxNow) : () => 1;
  const result = Engine.replay(data.txs, { method, fxOf });
  const summary = Engine.summarize(result, (a) => {
    const p = priceInfo(a);
    return p ? { price: p.price * fxNow, pct: p.pct, src: p.src } : null;
  });
  lastC = { cur, fxNow, method, fxOf, result, summary };
  return lastC;
}
function heldAssets() {
  const r = Engine.replay(data.txs, { method: 'avg' });
  return Object.keys(r.positions).filter((a) => r.positions[a].qty > 0 && a !== 'USDT');
}

function describeErr(e) {
  if (!e) return '未知錯誤';
  if (e.name === 'AbortError') return '連線逾時';
  if (e.status === 451 || e.status === 403) return '此網路位置無法存取幣安（HTTP ' + e.status + '）';
  if (e.status) return 'HTTP ' + e.status;
  return '網路連線失敗';
}

async function refreshPrices() {
  if (!session || market.busy) return;
  market.busy = true; market.status = 'loading';
  updateStatus();
  const held = heldAssets();
  let res = null, err = null;
  try { res = held.length ? await Market.fetchTickers(held) : { prices: {}, unknown: [] }; } catch (e) { err = e; }
  if (!session) return; // 抓價期間已鎖定：丟棄結果
  market.busy = false;
  if (err) { market.status = 'error'; market.error = describeErr(err); }
  else { market.prices = res.prices; market.unknown = res.unknown; market.status = 'ok'; market.error = null; market.updatedAt = Date.now(); }
  updateStatus();
  renderLive();
}

async function refreshFx() {
  if (!session) return;
  const c = Market.cachedFx();
  if (c && !market.fx) market.fx = { rate: c.rate, ts: c.ts, src: 'cache' };
  let f = null, err = null;
  try { f = await Market.fetchFx(); } catch (e) { err = e; }
  if (!session) return;
  if (f) { market.fx = { rate: f.rate, ts: f.ts, src: 'live' }; market.fxError = null; }
  else market.fxError = describeErr(err);
  renderLive();
}

function utcDayStart(ts) { return Math.floor(ts / DAY) * DAY; }
async function loadHistory() {
  if (!session) return;
  const first = {};
  for (const t of data.txs) if (t.asset !== 'USDT' && (first[t.asset] == null || t.ts < first[t.asset])) first[t.asset] = t.ts;
  const todo = Object.keys(first).filter((a) => !hist.closes[a] || hist.closes[a].start > utcDayStart(first[a]));
  if (!todo.length) { renderChart(); renderAssetCurves(); renderReturns(); return; }
  hist.status = 'loading';
  renderChart(); renderAssetCurves(); renderReturns();
  await Promise.all(todo.map(async (a) => {
    const start = utcDayStart(first[a]);
    try {
      const list = await Market.fetchDailyCloses(a, start);
      hist.closes[a] = { start, map: new Map(list.map((k) => [k.open, k.close])) };
      hist.failed = hist.failed.filter((x) => x !== a);
    } catch (e) { if (hist.failed.indexOf(a) < 0) hist.failed.push(a); }
  }));
  hist.status = 'ready'; hist.version++;
  if (session) { renderChart(); renderAssetCurves(); renderReturns(); }
}

/* ---------- 板塊順序 ---------- */
const SECTIONS = [['summary', '資產摘要'], ['chart', '資產淨值曲線'], ['curves', '各幣種曲線'], ['returns', '各幣種報酬率變化'],
  ['bars', '各幣種成本與損益'], ['alloc', '資產配置'], ['holdings', '持倉'], ['tx', '交易紀錄']];
function cleanOrder(o) {
  const keys = SECTIONS.map((x) => x[0]);

  (Array.isArray(o) ? o : []).forEach((k) => { if (keys.indexOf(k) >= 0 && out.indexOf(k) < 0) out.push(k); });

}

function openLayoutDialog() {

  modal((close) => {
    const list = h('ul', { class: 'order-list' });
    const save = (order) => { data.settings.order = order; persist(); applyOrder(); };
    function draw(focus) {
      clear(list);
      const order = cleanOrder(data.settings.order);
      order.forEach((k, i) => {
        list.appendChild(h('li', { class: 'order-item', 'data-key': k },
          h('span', { class: 'grip', title: '拖曳排序', 'aria-hidden': 'true' }, icon('grip')),
          h('span', { class: 'oname' }, (i + 1) + '. ' + names[k]),

          h('button', { class: 'btn icon small', type: 'button', 'data-act': 'down', 'aria-label': '下移「' + names[k] + '」', disabled: i === order.length - 1, onclick: () => move(k, 1) }, icon('down', 16))));
      });
      if (focus) {
        let b = list.querySelector('[data-key="' + focus[0] + '"] [data-act="' + focus[1] + '"]');
        if (!b || b.disabled) b = list.querySelector('[data-key="' + focus[0] + '"] button:not([disabled])');
        if (b) b.focus();
      }
    }
    function move(k, d) {
      const order = cleanOrder(data.settings.order);
      const i = order.indexOf(k), j = i + d;
      if (j < 0 || j >= order.length) return;
      order.splice(i, 1); order.splice(j, 0, k);
      save(order);
      draw([k, d < 0 ? 'up' : 'down']);
    }
    // 拖曳（滑鼠與觸控）：事件掛在 ul 上，搬動 li 不會中斷指標擷取
    let drag = null;

      const grip = e.target.closest && e.target.closest('.grip');
      if (!grip) return;
      drag = grip.closest('.order-item');

      try { list.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }

      }
      if (before) { if (drag.nextSibling !== before) list.insertBefore(drag, before); }
      else if (list.lastChild !== drag) list.appendChild(drag);
    });

      if (!drag) return;
      drag.classList.remove('dragging');
      drag = null;
      if (commit) save(Array.prototype.map.call(list.children, (li) => li.getAttribute('data-key')));
      draw();

function seriesOpts(C, days, nowTs) {

function getSeries(C) {

    seriesCache = { key, pts: all.slice(0, -1) };

    if (key === 'pnl') { const ev = C.result.events[t.id]; return ev && ev.type === 'sell' ? ev.pnl : null; }
    if (key === 'fee') return t.fee || 0;
    return t[key];
  };
}

function deleteTx(t) {
  confirmDialog({
    title: '刪除這筆交易？',
    body: fmtDT(t.ts) + '　' + (t.type === 'buy' ? '買入 ' : '賣出 ') + fmtQty(t.qty) + ' ' + t.asset + ' @ ' + fmtPrice(t.price, 'USDT') + ' USDT。刪除後無法復原。',

/* ===== app-sync.js ===== */
/* ------------------------------------------------------------------
 * 雲端同步：把「加密後」的帳本存進你自己的 GitHub 私人 repo（ledger.sync.json），
 * 多台裝置各自開網頁、貼上同一組設定，就會自動合併。
 *  - 交易、刪除、手動價格會同步；顯示設定（幣別、版面順序、主題…）各裝置獨立
 *  - Token 與同步密碼只存在本機加密的保險庫裡，不會寫進雲端檔案
 * ------------------------------------------------------------------ */
const SYNC_PATH = 'ledger.sync.json';
function freshSync() { return { status: 'off', at: null, error: null, code: null, busy: false, timer: null, lastCanon: null, cache: null, lastTry: 0 }; }
let syncSt = freshSync();

function syncCfg() {
  const s = data && data.sync;
  return s && s.token && s.owner && s.repo && s.pw ? s : null;
}
function syncReset() { clearTimeout(syncSt.timer); syncSt = freshSync(); }
function syncErr(code, msg) { const e = new Error(msg); e.code = code; return e; }

async function gh(cfg, method, path, body, headers) {
  try {
    return await fetch('https://api.github.com' + path, {
      method, cache: 'no-store',
      headers: Object.assign({ Authorization: 'Bearer ' + cfg.token, Accept: 'application/vnd.github+json' }, body ? { 'Content-Type': 'application/json' } : {}, headers || {}),
      body: body ? JSON.stringify(body) : undefined,
    });
  } catch (e) { throw syncErr('NETWORK', '連不上 GitHub，請檢查網路連線'); }
}
async function ghErr(res) {
  let msg = '';
  try { msg = (await res.json()).message || ''; } catch (e) { /* ignore */ }
  if (res.status === 401) return syncErr('AUTH', 'GitHub Token 無效或已過期，請重新產生並貼上新的 Token');
  if (res.status === 403) {
    if (res.headers.get('x-ratelimit-remaining') === '0') return syncErr('RATE', 'GitHub 暫時限制請求次數，稍後會自動重試');
    return syncErr('PERM', 'Token 權限不足：請確認它已授權這個 repo 的「Contents：Read and write」');
  }
  if (res.status === 404) return syncErr('NOTFOUND', '找不到這個 repo，或 Token 沒有它的權限（請確認帳號／repo 名稱）');
  return syncErr('HTTP', 'GitHub 回應 ' + res.status + (msg ? '：' + msg : ''));
}
async function ghCheckRepo(cfg) {
  const res = await gh(cfg, 'GET', '/repos/' + cfg.owner + '/' + cfg.repo);
  if (!res.ok) throw await ghErr(res);
  const j = await res.json();
  if (j.private !== true) throw syncErr('PUBLIC', '這個 repo 是公開的！同步檔案請放在「私人（Private）」repo，避免任何人都能下載。');
  if (j.permissions && j.permissions.push === false) throw syncErr('PERM', 'Token 對這個 repo 只有讀取權限，請授權「Contents：Read and write」');
}
async function ghGetFile(cfg) {
  const path = '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + SYNC_PATH;
  const res = await gh(cfg, 'GET', path);
  if (res.status === 404) return { sha: null, env: null };
  if (!res.ok) throw await ghErr(res);
  const j = await res.json();
  let text;
  if (j.encoding === 'base64' && j.content) text = atob(String(j.content).replace(/\s/g, ''));
  else {
    const raw = await gh(cfg, 'GET', path, null, { Accept: 'application/vnd.github.raw+json' });
    if (!raw.ok) throw await ghErr(raw);
    text = await raw.text();
  }
  let env;
  try { env = JSON.parse(text); } catch (e) { throw syncErr('FORMAT', '雲端的 ledger.sync.json 不是有效的同步檔'); }
  return { sha: j.sha, env };
}
async function ghPutFile(cfg, env, sha) {
  const body = { message: 'sync ' + new Date().toISOString(), content: btoa(JSON.stringify(env)) };
  if (sha) body.sha = sha;
  const res = await gh(cfg, 'PUT', '/repos/' + cfg.owner + '/' + cfg.repo + '/contents/' + SYNC_PATH, body);
  if (res.status === 409 || res.status === 422) throw syncErr('CONFLICT', '雲端資料剛被其他裝置更新');
  if (!res.ok) throw await ghErr(res);
}

async function openRemote(cfg, env) {
  try {
    const r = await Vault.openAny(env, cfg.pw, syncSt.cache);
    syncSt.cache = r.session;
    return r.data;
  } catch (e) {
    if (e.message === 'BAD_PIN') throw syncErr('BADPW', '同步密碼與雲端資料不符。請輸入建立雲端資料時設定的同步密碼。');
    throw syncErr('FORMAT', '雲端的 ledger.sync.json 不是有效的同步檔');
  }
}
async function sealRemote(cfg, payload) {
  if (!syncSt.cache) syncSt.cache = await Vault.newSession(cfg.pw);
  return Vault.sealWith(syncSt.cache, payload);
}

function setSyncStatus(st, err) {
  syncSt.status = st;
  syncSt.error = err ? err.message : null;
  syncSt.code = err ? err.code || 'ERR' : null;
  updateSyncChip();
  if (data && lastC && el.notices) renderNotices(lastC);
}

/** 抓雲端 → 合併 → 寫回本機／雲端。回傳 { ok, err, changed }。 */
async function runSync(reason) {
  const first = syncCfg();
  if (!first) return { ok: false, err: null };
  if (syncSt.busy) return { ok: false, err: null, busy: true };
  syncSt.busy = true; syncSt.lastTry = Date.now();
  clearTimeout(syncSt.timer);
  setSyncStatus('syncing');
  let changed = false;
  try {
    for (let attempt = 0; attempt < 4; attempt++) {
      const cfg = syncCfg();
      if (!cfg) return { ok: false, err: null };
      const remote = await ghGetFile(cfg);
      if (!data) return { ok: false, err: null };
      const remoteP = remote.env ? await openRemote(cfg, remote.env) : null;
      if (!data) return { ok: false, err: null };
      const localP = SyncCore.payloadOf(data);
      const merged = remoteP ? SyncCore.merge(localP, remoteP) : localP;
      if (SyncCore.canon(merged) !== SyncCore.canon(localP)) { applyRemote(merged); changed = true; }
      if (!remoteP || SyncCore.canon(merged) !== SyncCore.canon(remoteP)) {
        try { await ghPutFile(cfg, await sealRemote(cfg, merged), remote.sha); }
        catch (e) { if (e.code === 'CONFLICT' && attempt < 3) continue; throw e; }
      }
      if (!data) return { ok: false, err: null };
      syncSt.lastCanon = SyncCore.canon(merged);
      syncSt.at = Date.now();
      setSyncStatus('ok');
      return { ok: true, changed };
    }
    throw syncErr('CONFLICT', '同步時一直與其他裝置衝突，請稍後再試');
  } catch (e) {
    if (data) setSyncStatus('error', e);
    return { ok: false, err: e };
  } finally {
    syncSt.busy = false;
    if (data) syncNote();
  }
}

/** 把合併結果寫回本機並重繪 */
function applyRemote(merged) {
  SyncCore.applyTo(data, merged);
  data.txs = normalize({ txs: data.txs }).txs;
  syncSt.lastCanon = SyncCore.canon(merged);
  touchData(); hist.version++;
  persist();
  renderAll();
  loadHistory();
  refreshPrices();
  toast('已同步其他裝置的更新');
}

/** 本機資料有變動 → 稍後自動上傳 */
function syncNote() {
  if (!syncCfg() || !data) return;
  if (SyncCore.canon(SyncCore.payloadOf(data)) === syncSt.lastCanon) return;
  if (syncSt.busy || syncSt.status === 'error') return;   // 出錯時不連環重試，交給每分鐘輪詢或手動重試
  clearTimeout(syncSt.timer);
  syncSt.timer = setTimeout(() => runSync('local'), 1500);
  if (syncSt.status !== 'error') { syncSt.status = 'pending'; updateSyncChip(); }
}

function updateSyncChip() {
  const c = el.syncChip;
  if (!c) return;
  const cfg = syncCfg();
  c.hidden = !cfg;
  if (!cfg) return;
  const st = syncSt.status;
  c.className = 'btn small syncchip ' + st;
  c.querySelector('.txt').textContent =
    st === 'syncing' ? '同步中…' : st === 'ok' ? '已同步 ' + fmtTime(syncSt.at) : st === 'error' ? '同步失敗' : st === 'pending' ? '待同步' : '雲端同步';
  c.title = st === 'error' ? syncSt.error + '（點一下重試）' : '雲端同步：' + cfg.owner + '/' + cfg.repo + '（點一下立即同步）';
}

/* ---------- 同步設定碼（方便把設定貼到另一台裝置） ---------- */
function encodeSetup(cfg) {
  const bytes = new TextEncoder().encode(JSON.stringify({ o: cfg.owner, r: cfg.repo, t: cfg.token, p: cfg.pw }));
  let bin = ''; bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return 'cl1:' + btoa(bin);
}
function decodeSetup(code) {
  const m = /^cl1:([A-Za-z0-9+/=]+)$/.exec((code || '').trim());
  if (!m) throw new Error('這不是有效的同步設定碼');
  try {
    const bin = atob(m[1]);
    const o = JSON.parse(new TextDecoder().decode(Uint8Array.from(bin, (c) => c.charCodeAt(0))));
    if (!o.o || !o.r || !o.t || !o.p) throw new Error('x');
    return { repo: o.o + '/' + o.r, token: o.t, pw: o.p };
  } catch (e) { throw new Error('同步設定碼已損毀或不完整'); }
}

async function connectSync(f) {
  const repoStr = (f.repo || '').trim().replace(/^https?:\/\/github\.com\//i, '').replace(/\.git$/i, '').replace(/\/+$/, '');
  const m = /^([A-Za-z0-9_.-]+)\/([A-Za-z0-9_.-]+)$/.exec(repoStr);
  if (!m) throw new Error('Repo 請輸入「帳號/名稱」，例如 Eric-CYT/crypto-ledger-data');
  const token = (f.token || '').trim();
  if (token.length < 20) throw new Error('請貼上完整的 GitHub Token（通常以 github_pat_ 開頭）');
  const pw = f.pw || '';
  if (pw.length < 4) throw new Error('同步密碼至少 4 個字元');
  const cfg = { owner: m[1], repo: m[2], token, pw, path: SYNC_PATH };
  await ghCheckRepo(cfg);
  const prev = data.sync;
  data.sync = cfg; syncSt.cache = null; syncSt.lastCanon = null;
  const r = await runSync('connect');
  if (!r.ok) {
    data.sync = prev || null; syncSt.cache = null; syncSt.status = prev ? 'idle' : 'off'; updateSyncChip();
    throw r.err || new Error('同步失敗');
  }
  await persist();
  updateSyncChip();
  return r;
}

/* ------------------------------------------------------------------
 * 鎖定畫面、設定、啟動
 * ------------------------------------------------------------------ */
function detachLockKeys() {
  if (lockKeyHandler) { document.removeEventListener('keydown', lockKeyHandler); lockKeyHandler = null; }
}

function showLock() {
  detachLockKeys();
  stopTimers();
  clear($root);
  if (!Vault.supported()) {
    $root.appendChild(h('div', { class: 'lock' }, h('div', { class: 'lock-card' },
      h('h1', null, '無法使用'),
      h('p', { class: 'lock-sub' }, '這個瀏覽器不支援加密功能或禁止儲存資料。請改用 https 網址（例如 GitHub Pages）並關閉無痕模式後再試。'))));
    return;
  }
  const isSetup = !Vault.has();
  let entry = '', first = null, busy = false, countdown = null;

  const dots = [0, 1, 2, 3].map(() => h('span', { class: 'pin-dot' }));
  const dotsEl = h('div', { class: 'pin-dots', role: 'img', 'aria-label': 'PIN 輸入進度' }, dots);
  const sub = h('p', { class: 'lock-sub' });
  const msg = h('p', { class: 'lock-msg', role: 'status', 'aria-live': 'polite' });
  const keys = [];

  const setMsg = (t, kind) => { msg.textContent = t; msg.className = 'lock-msg' + (kind ? ' ' + kind : ''); };
  const paint = () => {
    dots.forEach((d, i) => d.classList.toggle('on', i < entry.length));
    dotsEl.setAttribute('aria-label', 'PIN 已輸入 ' + entry.length + ' 位');
  };
  const paintSub = () => {
    sub.textContent = isSetup ? (first === null ? '首次使用：請設定 4 位數密碼' : '請再輸入一次以確認') : '請輸入 4 位數密碼';
  };
  const setDisabled = (v) => keys.forEach((k) => { k.disabled = v; });
  const shake = () => { dotsEl.classList.remove('shake'); void dotsEl.offsetWidth; dotsEl.classList.add('shake'); };

  function checkLockout() {
    const ms = Vault.lockRemainingMs();
    if (ms > 0) {
      setDisabled(true);
      setMsg('嘗試次數過多，請等待 ' + Math.ceil(ms / 1000) + ' 秒後再試。', 'err');
      if (!countdown) countdown = setInterval(checkLockout, 500);
      return true;
    }
    if (countdown) { clearInterval(countdown); countdown = null; setMsg(''); }
    if (!busy) setDisabled(false);
    return false;
  }

  async function submit() {
    busy = true; setDisabled(true);
    const pin = entry;
    try {
      if (isSetup) {
        if (first === null) {
          first = pin; entry = ''; paint(); paintSub(); setMsg('');
        } else if (pin !== first) {
          first = null; entry = ''; paint(); paintSub(); shake(); setMsg('兩次輸入不一致，請重新設定。', 'err');
        } else {
          setMsg('建立加密資料中…');
          const d = defaultData();
          const sess = await Vault.create(pin, d);
          finish(sess, d);
          return;
        }
      } else {
        setMsg('驗證中…');
        try {
          const r = await Vault.unlock(pin);
          finish(r.session, r.data);
          return;
        } catch (e) {
          entry = ''; paint(); shake();
          if (e.message === 'BAD_PIN') {
            const f = Vault.recordFail();
            setMsg(f.lockedMs > 0 ? '密碼錯誤次數過多，暫時鎖定。' : '密碼錯誤（再錯 ' + f.remainingTries + ' 次會暫時鎖定）', 'err');
          } else setMsg('讀取資料失敗：資料格式異常。', 'err');
        }
      }
    } catch (e) {
      entry = ''; paint();
      setMsg(e.message === 'NO_STORAGE' ? '瀏覽器不允許儲存資料，請關閉無痕模式。' : '發生錯誤，請重試。', 'err');
    }
    busy = false;
    if (!checkLockout()) setDisabled(false);
  }

  function press(d) {
    if (busy || Vault.lockRemainingMs() > 0) return;
    if (entry.length >= 4) return;
    entry += d; paint();
    if (entry.length === 4) submit();
  }
  function back() { if (busy) return; entry = entry.slice(0, -1); paint(); }
  function finish(sess, d) {
    if (countdown) clearInterval(countdown);
    detachLockKeys();
    Vault.clearFails();
    enterApp(sess, d);
  }

  const keyBtn = (label, onclick, cls, aria) => {
    const b = h('button', { class: 'key' + (cls ? ' ' + cls : ''), type: 'button', onclick, 'aria-label': aria || label }, label);
    keys.push(b);
    return b;
  };
  const pad = h('div', { class: 'keypad' },
    ['1', '2', '3', '4', '5', '6', '7', '8', '9'].map((d) => keyBtn(d, () => press(d))),
    keyBtn('清除', () => { if (!busy) { entry = ''; paint(); } }, 'util', '清除輸入'),
    keyBtn('0', () => press('0')),
    (() => { const b = keyBtn('', back, 'util', '刪除一位'); b.appendChild(icon('backspace', 22)); return b; })());

  lockKeyHandler = (e) => {
    if (document.querySelector('dialog[open]')) return;
    if (e.key >= '0' && e.key <= '9' && !e.ctrlKey && !e.metaKey && !e.altKey) press(e.key);
    else if (e.key === 'Backspace') back();
    else if (e.key === 'Escape') { if (!busy) { entry = ''; paint(); } }
  };
  document.addEventListener('keydown', lockKeyHandler);

  const foot = isSetup
    ? h('p', { class: 'lock-foot' }, '密碼只用來加密這台裝置上的資料，忘記就無法找回。請定期在「設定」匯出備份。')
    : h('button', { class: 'btn link', type: 'button', onclick: async () => {
      const ok = await confirmDialog({
        title: '清除所有資料？',
        body: '忘記密碼無法復原資料。清除後，這個瀏覽器裡的所有交易紀錄都會永久刪除；若你有匯出過備份檔，之後可以還原（需要備份時的密碼）。',
        confirm: '清除並重新設定', danger: true,
      });
      if (ok) { Vault.reset(); showLock(); }
    } }, '忘記密碼？');

  $root.appendChild(h('div', { class: 'lock' }, h('div', { class: 'lock-card' },
    logoLarge(), h('h1', null, '加密貨幣帳本'), sub, dotsEl, msg, pad, foot)));
  paint(); paintSub(); checkLockout();
}

  return s('svg', { viewBox: '0 0 24 24', width: 48, height: 48, 'aria-hidden': 'true' },
    s('rect', { x: 2, y: 2, width: 20, height: 20, rx: 6, style: { fill: 'var(--c1)' } }),
    s('path', { d: 'M6 16l4-5 3 3 5-7', fill: 'none', stroke: '#fff', 'stroke-width': 2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }));
}

    const s0 = data.settings;
    const fxInfo = h('p', { class: 'hint muted' });
    const fxIn = numInput('fx-manual', s0.fxManual || '', '例如 31.8');
    const paintFx = () => {
      const f = market.fx;
      fxInfo.textContent = s0.fxManual > 0
        ? '目前使用手動匯率：' + num(s0.fxManual, 2, 4) + '。'
        : f ? '自動匯率：' + num(f.rate, 2, 4) + '（' + (f.src === 'live' ? '即時' : '快取') + '，來源 open.er-api.com，更新於 ' + fmtDT(f.ts) + '）。'
          : '尚未取得匯率' + (market.fxError ? '（' + market.fxError + '）' : '') + '。';
    };
    paintFx();
    const pinErr = h('div', { class: 'err', role: 'alert' });

    const themeCtl = h('div', { class: 'fgroup' });
    const udCtl = h('div', { class: 'fgroup' });
    const paintCtls = () => {
      clear(themeCtl); clear(udCtl);
      themeCtl.appendChild(segCtl('主題', [['auto', '跟隨系統'], ['light', '淺色'], ['dark', '深色']], prefs.theme, (v) => { prefs.theme = v; savePrefs(); applyTheme(); paintCtls(); }));
      udCtl.appendChild(segCtl('漲跌顏色', [['red-up', '紅漲綠跌'], ['green-up', '綠漲紅跌']], data.settings.ud, (v) => { data.settings.ud = v; persist(); renderAll(); paintCtls(); }));
    };
    paintCtls();

    const idle = h('select', { id: 'idle', onchange: (e) => { data.settings.idleMin = parseInt(e.target.value, 10); persist(); armIdle(); } },
      [[1, '1 分鐘'], [5, '5 分鐘'], [15, '15 分鐘'], [30, '30 分鐘'], [0, '不自動鎖定']].map((o) =>
        h('option', { value: o[0], selected: o[0] === s0.idleMin }, o[1])));

    const fileIn = h('input', { type: 'file', accept: '.json,application/json', style: { display: 'none' }, onchange: (e) => { const f = e.target.files[0]; e.target.value = ''; if (f) importBackup(f, close); } });

    return [
      h('h2', null, '設定'),
      h('p', { class: 'lead' }, '資料預設只存在這個瀏覽器（已加密）。想讓手機與電腦同步，請開啟下方「雲端同步」；也可以用「匯出備份／匯入備份」手動搬移。'),
      h('div', { class: 'row2' }, udCtl, themeCtl),
      h('div', { class: 'field', style: { marginTop: '12px' } }, h('label', { for: 'idle' }, '閒置自動鎖定'), idle),
      h('div', { class: 'sec' },
        h('h3', null, 'USDT → 台幣匯率'), fxInfo,
        h('div', { class: 'inline', style: { marginTop: '8px' } }, fxIn,
          h('button', { class: 'btn', type: 'button', onclick: () => {
            const v = parseFloat(fxIn.value);
            if (!(v > 0)) { toast('請輸入大於 0 的匯率'); return; }
            data.settings.fxManual = v; persist(); paintFx(); renderAll();
          } }, '套用'),
          h('button', { class: 'btn', type: 'button', onclick: () => { data.settings.fxManual = null; fxIn.value = ''; persist(); paintFx(); renderAll(); } }, '改用自動')),
        h('p', { class: 'hint muted', style: { marginTop: '6px' } }, '自動匯率是 USD/TWD 的市場匯率，把 USDT 視為 1 美元；實際買 USDT 的價格常略有價差，可在此手動輸入。')),
      h('div', { class: 'sec' },
        h('h3', null, '資料'),
        h('div', { class: 'btnrow' },
          h('button', { class: 'btn', type: 'button', onclick: exportBackup }, '匯出加密備份'),
          h('button', { class: 'btn', type: 'button', onclick: () => fileIn.click() }, '匯入備份'),
          h('button', { class: 'btn', type: 'button', onclick: exportCsv }, '匯出 CSV'),
          fileIn)),
      syncSection(),
      h('div', { class: 'sec' },
        h('h3', null, '安全'),
        h('div', { class: 'btnrow' },
          h('button', { class: 'btn', type: 'button', onclick: () => { close(); openChangePin(); } }, '修改密碼'),
          h('button', { class: 'btn danger', type: 'button', onclick: async () => {
            const ok = await confirmDialog({ title: '清除所有資料？', body: '這會永久刪除這個瀏覽器裡的所有交易紀錄與設定，無法復原。建議先匯出備份。', confirm: '清除全部', danger: true });
            if (!ok) return;
            Vault.reset(); lockNow();
          } }, '清除所有資料')),
        pinErr),
      h('div', { class: 'dlg-actions' }, h('button', { class: 'btn primary', type: 'button', onclick: () => close(true) }, '完成')),
    ];
  });
}

async function exportBackup() {
  // 備份檔不含雲端同步的 Token 與同步密碼
  const snap = JSON.parse(JSON.stringify(data));
  delete snap.sync;
  let raw;
  try { raw = await Vault.exportSealed(session, snap); } catch (e) { raw = null; }
  if (!raw) { toast('沒有可匯出的資料'); return; }
  download('crypto-ledger-backup-' + stampName() + '.json', raw, 'application/json');
  toast('已匯出加密備份（還原時需要現在的密碼）');
}
function exportCsv() {
  const head = ['時間', '類型', '幣種', '數量', '價格(USDT)', '手續費(USDT)', '匯率(USDT/TWD)', '備註'];
  const lines = [head.map(csvCell).join(',')];
  Engine.sortTx(data.txs).forEach((t) => {
    lines.push([fmtDT(t.ts), t.type === 'buy' ? '買入' : '賣出', t.asset, t.qty, t.price, t.fee || 0, t.fx || '', t.note || ''].map(csvCell).join(','));
  });
  download('crypto-ledger-' + stampName() + '.csv', '﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已匯出 CSV');
}
async function importBackup(file, closeSettings) {
  let text;
  try { text = await file.text(); } catch (e) { toast('讀取檔案失敗'); return; }
  const pin = await promptPin('匯入備份', '請輸入建立這份備份時使用的 4 位數密碼。');
  if (!pin) return;
  let d;
  try { d = normalize(await Vault.readBackup(text, pin)); }
  catch (e) { alertDialog('無法匯入', e.message === 'BAD_PIN' ? '密碼錯誤，或備份檔已損毀。' : '這不是有效的備份檔。'); return; }
  const ok = await confirmDialog({
    title: '用備份覆蓋目前資料？',
    body: '備份內有 ' + d.txs.length + ' 筆交易。匯入後會取代目前這個瀏覽器裡的所有交易與設定。',
    confirm: '匯入並覆蓋', danger: true,
  });
  if (!ok) return;
  // 匯入視為「以備份為準」：與目前資料比對，被取代的交易留下刪除記錄，之後同步時才不會又冒出來
  const st = SyncCore.stamp(data.txs, d.txs, data.deleted, Date.now());
  d.txs = st.txs;
  d.deleted = Object.assign({}, d.deleted, st.deleted);
  d.mpAt = SyncCore.stampMp(data.manualPrices, Object.assign({}, d.mpAt, data.mpAt), d.manualPrices, Date.now());
  d.sync = data.sync;
  data = d; touchData(); hist.version++;
  await persist();
  if (closeSettings) closeSettings(true);
  renderAll(); armIdle(); loadHistory(); refreshPrices();
  toast('已匯入 ' + d.txs.length + ' 筆交易');
}

function openChangePin() {
  return modal((close) => {
    const cur = pinField('pin-cur', '目前密碼'), n1 = pinField('pin-new', '新密碼'), n2 = pinField('pin-new2', '再輸入一次新密碼');
    const err = h('div', { class: 'err', role: 'alert' });
    const get = (f) => f.querySelector('input').value;
    const save = async () => {
      err.textContent = '';
      if (![get(cur), get(n1), get(n2)].every((v) => /^\d{4}$/.test(v))) { err.textContent = '密碼必須是 4 位數字。'; return; }
      if (get(n1) !== get(n2)) { err.textContent = '兩次輸入的新密碼不一致。'; return; }
      try { await Vault.unlock(get(cur)); } catch (e) { err.textContent = '目前密碼不正確。'; return; }
      try { session = await Vault.rekey(get(n1), JSON.parse(JSON.stringify(data))); }
      catch (e) { err.textContent = '儲存失敗，請重試。'; return; }
      close(true); toast('密碼已更新');
    };
    return [
      h('h2', null, '修改密碼'), h('p', { class: 'lead' }, '會用新密碼重新加密資料。舊的備份檔仍需使用當時的密碼才能還原。'),
      cur, n1, n2, err,
      h('div', { class: 'dlg-actions' },
        h('button', { class: 'btn', type: 'button', onclick: () => close(false) }, '取消'),
        h('button', { class: 'btn primary', type: 'button', onclick: save }, '更新密碼')),
    ];
  });
}

/* ---------- 啟動 ---------- */
(function init() {
  loadPrefs();
  const activity = () => { if (session) armIdle(); };
  ['pointerdown', 'keydown', 'touchstart', 'wheel'].forEach((ev) => window.addEventListener(ev, activity, { passive: true }));
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && session && (!market.updatedAt || Date.now() - market.updatedAt > 30000)) refreshPrices();
    if (document.visibilityState === 'visible' && session && syncCfg() && Date.now() - syncSt.lastTry > 20000) runSync('visible');
  });
  showLock();
})();

</script>
